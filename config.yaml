ollama:
  host: "http://ollama:11434"
  default_model: "translategemma:4b"
  auto_download: true

llm:
  temperature: 0.1
  max_tokens: 8192
  top_p: 0.9
  num_thread: 18

models:
  - name: "translategemma:4b"
    prompt_type: "translategemma"
  - name: "ministral-3:3b"
    prompt_type: "generic"

translation:
  default_source_lang: "auto"
  default_target_lang: "es"

languages:
  - code: "auto"
    name: "Detect Language"
  - code: "es"
    name: "Spanish"
  - code: "en"
    name: "English"
  - code: "fr"
    name: "French"
  - code: "de"
    name: "German"
  - code: "it"
    name: "Italian"
  - code: "pt"
    name: "Portuguese"
  - code: "zh"
    name: "Chinese"
  - code: "ja"
    name: "Japanese"
  - code: "gl"
    name: "Galician"
  - code: "ca"
    name: "Catalan"
  - code: "eu"
    name: "Basque"
